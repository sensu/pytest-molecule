[build-system]
requires = [
  "pip >= 19.3.1",
  "setuptools >= 42",
  "wheel >= 0.33.6",
]
build-backend = "setuptools.build_meta"

[tool.black]
skip-string-normalization = false

[tool.isort]
profile = "black"
known_first_party = "molecule"

[tool.pylint.master]
ignored-modules = ["molecule", "pytest", "yaml", "_pytest"]

